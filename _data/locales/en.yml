about:
  - "Senior DevOps / Platform Engineer with 10+ years of experience building and operating cloud and Kubernetes platforms across AWS and on-premises environments."
  - "My experience spans AWS infrastructure, Kubernetes, infrastructure as code, CI/CD, observability, production operations, and platform security."
  - "This portfolio presents selected professional experience, technical case studies, and personal projects that reflect how I build, operate, and improve production platforms."

about_page:
  title: "About me"
  intro: "Senior DevOps / Platform Engineer with 10+ years of experience building and operating cloud and Kubernetes platforms across AWS and on-premises environments. Experienced in infrastructure automation, CI/CD, container platforms, monitoring, and production operations, with a focus on reliable, scalable, and secure infrastructure."
  sections:
    - title: "Background"
      paragraphs:
        - "I started my career working with infrastructure and Linux-based environments and gradually moved into DevOps and Kubernetes-focused roles."
        - "Over the past 10+ years, I have worked across cloud, banking, and airline environments, building and operating platforms that support production workloads. I hold a B.Sc. in Software Engineering and continue to deepen my expertise in Kubernetes, AWS, and platform engineering."

    - title: "What I work on"
      paragraphs:
        - "My focus is on cloud and platform infrastructure, with hands-on experience across AWS, Kubernetes, Terraform, Linux, containerized workloads, and CI/CD automation."
        - "I work on areas such as infrastructure provisioning, Kubernetes operations, deployment automation, observability, reliability, access control, security remediation, and troubleshooting production issues."

    - title: "How I approach projects"
      paragraphs:
        - "I focus on building infrastructure that is reliable, repeatable, observable, and practical to operate. I prefer automation over repetitive manual work and use monitoring, troubleshooting, and production experience to identify and address infrastructure bottlenecks."
        - "I also document decisions and lessons learned, while keeping security, maintainability, and operational simplicity in mind."

