about:
  - "DevOps / Platform Engineer with 10+ years of experience building and operating cloud and Kubernetes platforms across AWS and on-premises environments."
  - "My experience spans infrastructure automation, Kubernetes, CI/CD, observability, production operations, and platform security."
  - "This portfolio presents selected professional experience, technical case studies, and personal projects that reflect how I build, operate, and improve production platforms."

about_page:
  title: "About me"
  intro: "Senior DevOps / Platform Engineer with 10+ years of experience building and operating cloud and Kubernetes platforms across AWS and on-premises environments. My experience spans infrastructure automation, Kubernetes, CI/CD, observability, production operations, and platform security, with a focus on building reliable, scalable, and maintainable infrastructure."

  sections:
    - title: "About Me"
      paragraphs:
        - "I am a DevOps / Platform Engineer focused on building and operating reliable infrastructure and Kubernetes platforms. My experience combines traditional infrastructure, cloud environments, automation, and production operations."

    - title: "My Engineering Journey"
      paragraphs:
        - "I started my career in system administration, working with Linux and Microsoft environments and supporting enterprise infrastructure. My early experience included Windows Server, Active Directory, VMware and Hyper-V virtualization, server administration, and infrastructure monitoring."
        - "As my experience grew, I moved toward Linux-based environments, infrastructure automation, configuration management, networking, monitoring, and production infrastructure. This gradually led me into DevOps, Kubernetes, and platform engineering."
        - "Over the past 10+ years, I have worked across enterprise, banking, and airline environments, evolving from traditional system and infrastructure administration toward automation, CI/CD, cloud infrastructure, container platforms, and Kubernetes-based environments."

    - title: "What I Work On"
      paragraphs:
        - "My work focuses on infrastructure, automation, and platform engineering across both traditional and modern environments."
        - "I have experience with AWS infrastructure, Kubernetes and container platforms, Terraform and configuration automation, CI/CD and deployment automation, monitoring and observability, production troubleshooting, access control, and infrastructure security."

    - title: "How I Approach Engineering"
      paragraphs:
        - "I focus on building infrastructure that is reliable, repeatable, observable, and practical to operate. I prefer automation over repetitive manual work and use monitoring, troubleshooting, and production experience to identify and address infrastructure bottlenecks."
        - "When solving infrastructure problems, I look beyond the immediate symptom and consider reliability, maintainability, security, and operational impact."
        - "I also document technical decisions and lessons learned so that systems and operational processes are easier to understand, maintain, and improve."

    - title: "Production Experience"
      paragraphs:
        - "My experience includes supporting production environments where reliability, security, performance, and operational continuity are important. I have worked across AWS cloud platforms, Kubernetes clusters, on-premises infrastructure, air-gapped enterprise environments, and production workloads in banking and airline domains."
        - "Working across these environments has given me a broad understanding of how infrastructure, applications, networking, security, and operations work together to support business-critical systems."

    - title: "Continuous Learning"
      paragraphs:
        - "I continue to deepen my expertise in Kubernetes, AWS, and platform engineering through hands-on labs, technical study, and practical projects."
        - "I use AI-assisted tools for technical research, troubleshooting, documentation, and learning, while validating solutions through hands-on testing and engineering judgment."
        - "I prefer learning by building, troubleshooting, and applying concepts in realistic environments rather than relying only on theoretical knowledge."

    - title: "Education"
      paragraphs:
        - "B.Sc. in Software Engineering — Mazandaran Institute of Technology"

