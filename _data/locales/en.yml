work:
  title: "Work"
  eyebrow: "ENGINEERING IN PRACTICE"
  intro: "Explore the production problems I investigated, the actions taken, and the engineering lessons—alongside focused hands-on projects."
  method: "Problem first, evidence next, then the response and its operational impact. Project labs are clearly distinguished from production experience."
  count_label: "LAB PROJECTS"
  featured_label: "PRODUCTION CASE STUDY"
  featured_meta: "PRODUCTION TROUBLESHOOTING · AWS / EKS"
  featured_title: "Why were running EKS workloads still causing latency?"
  featured_excerpt: "API and ingestion workloads showed increased latency alongside CPU throttling and memory-related container failures. I reviewed Prometheus and Grafana signals and worked with the team to investigate the symptoms without treating correlation as proof of root cause."
  featured_link: "Read the case study"
  onprem_label: "PRODUCTION TROUBLESHOOTING · ON-PREMISES KUBERNETES"
  onprem_title: "How did one resource-intensive service affect shared workloads?"
  onprem_excerpt: "High CPU and memory use coincided with application failures. The team stopped the problematic service to reduce immediate impact, then improved resource configuration and health-check consistency across deployments."
  onprem_link: "Explore the TATA / Tejarat Bank experience"
  cicd_label: "PRODUCTION DELIVERY · CI/CD"
  cicd_title: "How did we make delivery more repeatable in a restricted banking environment?"
  cicd_excerpt: "I supported standardized delivery workflows for banking applications using Bamboo and Bitbucket, with internal JFrog artifact management and SonarQube and Trivy checks. The environment had no direct Internet access from build VMs, so builds and dependencies relied on controlled internal services."
  cicd_link: "Explore the TATA / Tejarat Bank experience"
  lab_eyebrow: "BUILT & DOCUMENTED"
  lab_title: "Engineering labs"
  lab_intro: "Problem-led hands-on examples covering platform design, repeatable delivery, infrastructure separation, and security checks. These are labs and design explorations—not claims of production incidents or production ownership."
